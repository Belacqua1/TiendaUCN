<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Tienda UCN</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #4CAF50;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        .body {
            padding: 20px;
            color: #333333;
        }

        .body h1 {
            font-size: 24px;
        }

        .body p {
            font-size: 16px;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white !important;
            text-decoration: none;
            border-radius: 5px;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #999999;
            padding: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>Tienda UCN</h2>
        </div>
        <div class="body">
            <h1>¡Bienvenido a Tienda UCN!</h1>
            <p>Hola <strong>{{NAME}}</strong>,</p>
            <p>Gracias por registrarte en nuestra plataforma. Estamos felices de tenerte con nosotros.</p>
            <p>Ahora puedes explorar nuestros productos y aprovechar nuestras ofertas especiales.</p>
        </div>
        <div class="footer">
            © 2025 Tienda UCN. Todos los derechos reservados.
        </div>
    </div>
</body>

</html>
